apiVersion: v1
kind: Service
metadata:
  name: {{ .Chart.Name }}
  labels:
    app: {{ .Chart.Name }}
spec:
  type: {{ .Values.service.type }} #  -ClusterIP use defualt
  ports:
  - port: {{ .Values.service.port }} # port 5000
    targetPort: 5000
    protocol: TCP
  selector:
    app: {{ .Chart.Name }}
