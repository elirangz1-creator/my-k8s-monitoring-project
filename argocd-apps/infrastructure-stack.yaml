# ======================================================================================
# ARGOCD APPLICATION MANIFEST: INFRASTRUCTURE MONITORING STACK (PROMETHEUS & GRAFANA)
# ======================================================================================
apiVersion: argoproj.io/v1alpha1     # Core ArgoCD API version for managing Applications
kind: Application                    # Defines this resource type as an ArgoCD Application
metadata:
  name: kube-prometheus-stack        # The unique name of the application in the ArgoCD UI
  namespace: argocd                  # The namespace where the ArgoCD controller is running
  finalizers:
    - resources-finalizer.argocd.argoproj.io # Ensures clean cascading deletion of sub-resources
spec:
  project: default                   # Assigns the application to the default ArgoCD project
  source:
    # ----------------------------------------------------------------------------------
    # 🔗 SOURCE CONFIGURATION: POINTING DIRECTLY TO YOUR PRIVATE GITHUB REPOSITORY
    # ----------------------------------------------------------------------------------
    repoURL: 'https://prometheus-community.github.io/helm-charts'  ## 'https://github.com/elirangz1-creator/my-k8s-monitoring-project.git'
    targetRevision: main             # Tracks the main branch of your Git repository
    path: argocd-apps                # The directory inside your repository containing the manifests
  
  destination:
    # ----------------------------------------------------------------------------------
    # 🎯 DESTINATION CONFIGURATION: WHERE TO DEPLOY THE RESOURCES
    # ----------------------------------------------------------------------------------
    server: 'https://kubernetes.default.svc' # Target fully-qualified core cluster internal API server endpoint
    namespace: monitoring                     # The target isolated namespace where the components are deployed
  
  syncPolicy:
    # ----------------------------------------------------------------------------------
    # 🔄 AUTOMATION AND SYNCHRONIZATION POLICIES (GitOps)
    # ----------------------------------------------------------------------------------
    createNamespace: true            # Tells ArgoCD to automatically generate the 'monitoring' namespace if missing
    automated:
      prune: true                    # Automatically removes deleted components from the cluster if removed from Git
      selfHeal: true                 # Automatically overrides drift changes made inside the cluster back to the Git state

