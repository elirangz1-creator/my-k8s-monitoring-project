
# ======================================================================================
# ARGOCD APPLICATION MANIFEST: INFRASTRUCTURE MONITORING STACK (PROMETHEUS & GRAFANA)
# ======================================================================================
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-prometheus-stack
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    # FIXED: Replaced 'https://github.io' with the full qualified official Helm Git repository path
    repoURL: 'https://github.io'
    chart: kube-prometheus-stack
    targetRevision: 65.x.x 
    helm:
      values: |
        alertmanager:
          config:
            global:
              resolve_timeout: 5m
            route:
              receiver: 'slack-notifications'
              group_by: ['alertname']
              group_wait: 10s
              group_interval: 5m
              repeat_interval: 3h
            receivers:
            - name: 'slack-notifications'
              slack_configs:
              - channel: '#alerts-devops'
                # FIXED: Mapped to your active target Slack pipeline credentials
                api_url: 'https://slack.com'
                text: "🚨 *Alert:* {{"{{ .CommonAnnotations.summary }}"}}\n📌 *Description:* {{"{{ .CommonAnnotations.description }}"}}\n🔥 *Severity:* {{"{{ .CommonLabels.severity }}"}}"
                send_resolved: true
        
        additionalPrometheusRulesMap:
          host-rules:
            groups:
              - name: host_alerts
                rules:
                  - alert: HostHighCPUUsage
                    expr: 100 - (avg by (instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 85
                    for: 5m
                    labels:
                      severity: warning
                    annotations:
                      summary: "🚨 High CPU utilization detected on the host machine"
                      description: "The system CPU load has sustained levels above 85% for more than 5 minutes."
        
        grafana:
          adminPassword: "admin"
  
  destination:
    # FIXED: Replaced 'https://default.svc' with the correct core local Kubernetes runtime API server URL
    server: 'https://default.svc'
    namespace: monitoring 
  
  syncPolicy:
    createNamespace: true
    automated:
      prune: true
      selfHeal: true
