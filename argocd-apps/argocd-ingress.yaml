# ======================================================================================
# KUBERNETES INGRESS MANIFEST: NATIVE TRAEFIK DOMAIN ROUTING FOR ARGOCD UI
# ======================================================================================
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: argocd-server-ingress
  namespace: argocd
  annotations:
    # Tells Traefik to accept the secure backend port
    traefik.ingress.kubernetes.io/router.entrypoints: "websecure"
    traefik.ingress.kubernetes.io/router.tls: "true"
    
    # 🚨 THE FIX: Instructs Traefik to skip internal SSL verification for the backend service pod
    traefik.ingress.kubernetes.io/service.serversstransport: "insecure@internal"
spec:
  ingressClassName: public
  rules:
  - host: argocd.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: argocd-server
            port:
              number: 443
     
