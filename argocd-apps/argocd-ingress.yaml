# ======================================================================================
# KUBERNETES INGRESS MANIFEST: NATIVE TRAEFIK DOMAIN ROUTING FOR ARGOCD UI
# ======================================================================================
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: argocd-server-ingress
  namespace: argocd
  annotations:
    # TRAEFIK SPECIFIC: Tells the Traefik engine to communicate with the backend via secure HTTPS
    traefik.ingress.kubernetes.io/router.entrypoints: "websecure"
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  # Traefik in MicroK8s automatically picks up rules marked with the default ingress class
  rules:
  - host: argocd.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: argocd-server
            port:
              number: 443
