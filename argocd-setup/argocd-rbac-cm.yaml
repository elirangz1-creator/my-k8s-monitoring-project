# ==============================================================================
# SECTION 1: METADATA & TYPE DEFINITION
# ==============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  labels:
    app.kubernetes.io/component: server
    app.kubernetes.io/name: argocd-rbac-cm
    app.kubernetes.io/part-of: argocd
  name: argocd-rbac-cm
  namespace: argocd

# ==============================================================================
# SECTION 2: RBAC ANONYMOUS ADMIN POLICY CONFIGURATION
# ==============================================================================
data:
  # Sets the default policy role for anyone accessing the UI without logging in
  policy.default: role:admin
  # Grants full cluster-wide administrative access to the anonymous role
  policy.csv: |
    p, role:admin, applications, *, */*, allow
    p, role:admin, projects, *, *, allow
    p, role:admin, clusters, *, *, allow
    p, role:admin, repositories, *, *, allow
