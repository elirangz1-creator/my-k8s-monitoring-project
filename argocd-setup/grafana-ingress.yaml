# ==============================================================================
# SECTION 1: METADATA & INGRESS ROUTING DEFINITION
# ==============================================================================

# Specifies the core networking API group and version for Ingress routing
apiVersion: networking.k8s.io/v1
# Defines the type of Kubernetes resource being created
kind: Ingress
metadata:
  # The unique name of this Ingress routing rule within the namespace
  name: grafana-ingress
  # Specifies the target namespace where the monitoring stack is running
  namespace: monitoring
  annotations:
    # Disables automatic SSL redirection for local, non-production HTTP testing
    nginx.ingress.kubernetes.io/ssl-redirect: "false"

# ==============================================================================
# SECTION 2: ROUTING RULES & TRAFFIC DESTINATION
# ==============================================================================
spec:
  rules:
    # The local domain host that your browser will use to resolve traffic
  - host: grafana.local
    http:
      paths:
        # Matches all incoming requests starting from the root URL path
      - path: /
        # Specifies a prefix-based path matching strategy
        pathType: Prefix
        backend:
          service:
            # The exact name of the internal Grafana service generated by Helm
            name: kube-prometheus-stack-grafana
            port:
              # The internal container service port handling web UI traffic
              number: 80
