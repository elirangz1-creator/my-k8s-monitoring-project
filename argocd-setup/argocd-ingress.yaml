# ==============================================================================
# SECTION 1: METADATA & INGRESS CONTROLLER ANNOTATIONS
# ==============================================================================
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  # The unique routing rule name for accessing the Argo CD dashboard
  name: argocd-server-ingress
  namespace: argocd
  annotations:
    # NGINX Configuration: Prevents infinite HTTPS redirect loops
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/backend-protocol: "HTTP"
    # TRAEFIK Configuration: Forces standard HTTP backend routing
    traefik.ingress.kubernetes.io/service.serversscheme: "http"

# ==============================================================================
# SECTION 2: TRAFFIC ROUTING RULES & BACKEND TARGETS
# ==============================================================================
spec:
  # Binds this routing definition to the native MicroK8s ingress controller class
  ingressClassName: public
  rules:
    # The local domain map entry defined in your host machine file
  - host: argocd.local
    http:
      paths:
        # Catches and forwards all web traffic starting from the root domain slash
      - path: /
        pathType: Prefix
        backend:
          service:
            # The internal cluster network service that exposes the Argo UI pods
            name: argocd-server
            port:
              # Routes traffic directly through the plain-text web engine port mapping
              number: 80





     
