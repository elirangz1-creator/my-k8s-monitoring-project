# ======================================================================================
# KUBERNETES INGRESS MANIFEST: NATIVE TRAEFIK DOMAIN ROUTING FOR INSECURE ARGOCD APPS
# ======================================================================================
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: argocd-server-ingress
  namespace: argocd
spec:
  # Instructs the native MicroK8s Traefik ingress class to automatically route this configuration
  ingressClassName: public
  rules:
  - host: argocd.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: argocd-server
            port:
              # Routes traffic directly through the standard plain-text web engine port mapping
              number: 80

     
