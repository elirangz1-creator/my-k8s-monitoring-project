### ==============================================================================
# SECTION 1: METADATA & TYPE DEFINITION 
# ==============================================================================
# SECTION 1: METADATA & TYPE DEFINITION 
# ==============================================================================
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-prometheus-stack
  namespace: argocd
  annotations:
    # CRITICAL FIXED: Tells ArgoCD to look for its resource overrides and configmaps in the core 'argocd' namespace, not inside the destination monitoring namespace
    argocd.argoproj.io/tracking-id: kube-prometheus-stack
spec:
  project: default

# ==============================================================================
# SECTION 2: SOURCE CONFIGURATION (OFFICIAL HELM REGISTRY)
# ==============================================================================
  source:
    repoURL: 'https://prometheus-community.github.io/helm-charts'
    chart: kube-prometheus-stack
    targetRevision: 65.5.0

# ==============================================================================
# SECTION 3: DESTINATION CONFIGURATION
# ==============================================================================
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: monitoring

# ==============================================================================
# SECTION 4: AUTOMATION & CONFLICT POLICIES
# ==============================================================================
  syncPolicy:
    createNamespace: true
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true

