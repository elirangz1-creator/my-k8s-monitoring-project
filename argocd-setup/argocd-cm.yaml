# ==============================================================================
# SECTION 1: METADATA & TYPE DEFINITION
# ==============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  labels:
    app.kubernetes.io/component: server
    app.kubernetes.io/name: argocd-cm
    app.kubernetes.io/part-of: argocd
  name: argocd-cm
  namespace: argocd

# ==============================================================================
# SECTION 2: CORE SERVER CONFIGURATION & AUTHENTICATION SETTINGS
# ==============================================================================
data:
  # Enables the master admin account globally within the cluster
  admin.enabled: "true"
  # Allows the UI to load automatically without forcing a manual username/password login screen
  users.anonymous.enabled: "true"
  # CRITICAL FIXED: Tells ArgoCD server to accept unencrypted HTTP requests from the Ingress proxy
  server.insecure: "true"

